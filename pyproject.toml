[project]
name = "Bitrecs_V2"
version = "2.0"
description = "Bitrecs V2 - Prompt Evolution Subnet"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "bittensor>=10.1.0",    
    "bittensor-wallet>=4.0.1",
    "cryptography>=45.0.5",
    "async-substrate-interface>=1.6.1",
    "affinetes @ git+https://github.com/AffineFoundation/affinetes.git@main",
    "python-dotenv>=1.2.1",
    "fastapi>=0.128.0",
    "slowapi>=0.1.9",
    "httpx>=0.28.1",
    "openai>=2.16.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.40.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "numpy>=2.4.1",
    "cachetools>=6.2.0",
    "psycopg[binary]>=3.2.12",
    "asyncpg>=0.31.0",
    "jinja2>=3.1.6",
    "aioboto3>=15.5.0",
    "python-multipart>=0.0.21",
    "rich>=14.2.0",
    "click>=8.3.1",
    "pandas>=2.3.3",
    "bittensor-cli>=9.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  "."
]
testpaths = ["tests"]
