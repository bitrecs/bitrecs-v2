services:
  validator:
    image: ghcr.io/bitrecs/bitrecs-v2:main
    container_name: bitrecs-validator
    restart: unless-stopped
    privileged: true  # Allow DinD access
    user: root  # Run as root for socket access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Keep this
      - ~/.bittensor/wallets:/root/.bittensor/wallets:ro
      - /var/log/bitrecs/validator:/var/log/bitrecs/validator
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=unix:///var/run/docker.sock  # Explicitly set Docker host
    networks:
      - bitrecs-network
    command: ["uv", "run", "/app/validator/sample_validator.py"]

  watchtower:
    image: containrrr/watchtower  # Official image
    container_name: bitrecs-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_USERNAME=${DOCKER_USERNAME}  # Set these in .env or host env
      - DOCKER_PASSWORD=${DOCKER_PASSWORD}
    command: --interval 120 --debug ghcr.io/bitrecs/bitrecs-v2/validator  # Target the image name

networks:
  bitrecs-network:
    external: false