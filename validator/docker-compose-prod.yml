services:
  validator:
    image: ghcr.io/bitrecs/bitrecs-v2:main
    container_name: bitrecs-validator
    restart: unless-stopped
    privileged: true  # Allow DinD access
    user: root  # Run as root for socket access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.bittensor/wallets:/root/.bittensor/wallets:ro
      - /root/bitrecs/data:/app/data
      - /var/log/bitrecs/validator:/var/log/bitrecs/validator
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=unix:///var/run/docker.sock  # Explicitly set Docker host
    networks:
      - bitrecs-network
    command: ["uv", "run", "/app/validator/sample_validator.py"]

  watchtower:
    image: nickfedor/watchtower
    container_name: bitrecs-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
    command: --interval 120 --debug bitrecs-validator

networks:
  bitrecs-network:
    external: false